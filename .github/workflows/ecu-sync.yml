# Autogenerated by https://github.com/change-engine/ecu/github

# ecu pushes its managed files to ecu/sync. This regenerates the files derived from them,
# then opens a PR that squash-merges once CI passes.
name: ecu sync
on:
  push:
    branches: [ecu/sync]

permissions: {}

concurrency:
  # The bot's own push must not cancel the run that made it.
  group: ecu-sync-${{ github.actor == 'ecu-sync[bot]' && 'bot' || 'ecu' }}
  cancel-in-progress: true

env:
  TITLE: Autogenerated by https://github.com/change-engine/ecu/github

jobs:
  generate:
    if: github.actor != 'ecu-sync[bot]'
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Hold the PR until this push is regenerated; publish turns auto-merge back on.
      - run: gh pr merge ecu/sync --repo "$GITHUB_REPOSITORY" --disable-auto || true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Start from main's lockfiles so bumps made there are kept, not reverted.
      - name: Merge main
        run: |
          git -c user.name=ecu-sync -c user.email=ecu-sync@invalid merge --no-commit --no-ff origin/main || true
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              pnpm-lock.yaml|uv.lock|worker-configuration.d.ts) git checkout --theirs -- "$f" && git add -- "$f" ;;
              *) echo "::error::$f conflicts with main"; exit 1 ;;
            esac
          done

      # Install scripts run here, so this job has no token that can push.
      - name: Regenerate
        run: |
          if [ -f package.json ]; then
            pnpm install --no-frozen-lockfile
            if [ -f wrangler.jsonc ] || [ -f worker-configuration.d.ts ]; then
              pnpm wrangler types --env-file=/dev/null --strict-vars=false
            fi
          fi
          if [ -f pyproject.toml ]; then
            uv lock
          fi

      - name: Diff
        run: |
          for f in pnpm-lock.yaml uv.lock worker-configuration.d.ts; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --binary HEAD > "$RUNNER_TEMP/sync.patch"

      - uses: actions/upload-artifact@v7
        with:
          name: sync
          path: ${{ runner.temp }}/sync.patch

  publish:
    needs: [generate]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Pushes made with GITHUB_TOKEN don't trigger CI, so commit and merge as the app.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ECU_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ECU_SYNC_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          name: sync
          path: ${{ runner.temp }}

      - name: Commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        # CI skips ecu's own pushes to ecu/sync and runs on this commit instead, so commit
        # even when nothing needed regenerating: a skipped check counts as passed.
        run: |
          if [ -s "$RUNNER_TEMP/sync.patch" ]; then
            git apply --index "$RUNNER_TEMP/sync.patch"
          fi
          id=$(gh api "users/$BOT" --jq .id)
          git -c user.name="$BOT" -c user.email="$id+$BOT@users.noreply.github.com" commit --allow-empty -m "$TITLE"
          git push origin HEAD:ecu/sync

      - name: Pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          number=$(gh pr list --head ecu/sync --state open --json number --jq '.[].number')
          if [ -z "$number" ]; then
            gh pr create --head ecu/sync --base main --title "$TITLE" \
              --body "Changes from [ecu](https://github.com/change-engine/ecu/tree/main/github), with lockfiles and generated types refreshed by the ecu sync workflow. Merges once the checks main requires pass."
            number=$(gh pr list --head ecu/sync --state open --json number --jq '.[].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The main-* rulesets need an approving review; as in dependabot.yml, github-actions gives it.
      - name: Approve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)" != APPROVED ]; then
            gh pr review "$PR" --approve
          fi

      - name: Merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        # --auto is refused when nothing is left to wait for: required checks already passed,
        # or no ruleset requires any yet (a new repo). Then merge now; the app can't bypass
        # the rulesets, so this still fails if anything main requires is missing.
        run: |
          gh pr merge "$PR" --auto --squash --subject "$TITLE" ||
            gh pr merge "$PR" --squash --subject "$TITLE"
