# Autogenerated by https://github.com/change-engine/ecu/github

# ecu pushes its managed files to ecu/sync. This regenerates the files derived from them,
# then opens a PR that squash-merges once CI passes.
name: ecu sync
on:
  push:
    branches: [ecu/sync]

permissions: {}

concurrency:
  # The bot's own push must not cancel the run that made it.
  group: ecu-sync-${{ github.actor == 'ecu-sync[bot]' && 'bot' || 'ecu' }}
  cancel-in-progress: true

env:
  TITLE: Autogenerated by https://github.com/change-engine/ecu/github

jobs:
  generate:
    if: github.actor != 'ecu-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      sha: ${{ steps.base.outputs.sha }}
      main: ${{ steps.merge.outputs.main }}
    steps:
      # Hold the PR until this push is regenerated; publish turns auto-merge back on.
      - run: gh pr merge ecu/sync --repo "$GITHUB_REPOSITORY" --disable-auto || true
        env:
          GH_TOKEN: ${{ github.token }}

      # ecu pushes one commit per file, and the run that survives cancel-in-progress isn't always
      # the one for the newest commit. So regenerate the branch as it is now, not github.sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ecu/sync
          fetch-depth: 0
          persist-credentials: false

      # GitHub's runners, unlike the boxen, have no pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: corepack enable

      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Start from main's lockfiles so bumps made there are kept, not reverted. Anything else that
      # conflicts is a file ecu writes, so ecu's version wins, and the PR shows what it changes on
      # main (often a version Renovate bumped there). Stopping here would leave ecu/sync with no PR,
      # and every later push from ecu failing the same way.
      - name: Merge main
        id: merge
        run: |
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git -c user.name=ecu-sync -c user.email=ecu-sync@invalid merge --no-commit --no-ff origin/main || true
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              pnpm-lock.yaml|uv.lock|worker-configuration.d.ts) git checkout --theirs -- "$f" && git add -- "$f" ;;
              *)
                echo "::warning::$f conflicts with main; keeping ecu's"
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout --ours -- "$f" && git add -- "$f"
                else
                  git rm -q -- "$f"
                fi
                ;;
            esac
          done

      # Install scripts run here, so this job has no token that can push.
      - name: Regenerate
        run: |
          if [ -f package.json ]; then
            pnpm install --no-frozen-lockfile
            if [ -f wrangler.jsonc ] || [ -f worker-configuration.d.ts ]; then
              pnpm wrangler types --env-file=/dev/null --strict-vars=false
            fi
          fi
          if [ -f pyproject.toml ]; then
            uv lock
          fi

      - name: Diff
        run: |
          for f in pnpm-lock.yaml uv.lock worker-configuration.d.ts; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --binary HEAD > "$RUNNER_TEMP/sync.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync
          path: ${{ runner.temp }}/sync.patch

  publish:
    needs: [generate]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # Pushes made with GITHUB_TOKEN don't trigger CI, so commit and merge as the app.
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ECU_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ECU_SYNC_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.sha }}
          token: ${{ steps.app.outputs.token }}
          # For the main generate merged
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync
          path: ${{ runner.temp }}

      - name: Commit
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          BASE: ${{ needs.generate.outputs.sha }}
          MAIN: ${{ needs.generate.outputs.main }}
        # CI skips ecu's own pushes to ecu/sync and runs on this commit instead, so commit
        # even when nothing needed regenerating: a skipped check counts as passed.
        run: |
          # main as a second parent, so the PR merges cleanly; the patch then gives generate's tree
          git -c user.name=ecu-sync -c user.email=ecu-sync@invalid merge --no-commit --no-ff -s ours "$MAIN"
          if [ -s "$RUNNER_TEMP/sync.patch" ]; then
            git apply --index "$RUNNER_TEMP/sync.patch"
          fi
          id=$(gh api "users/$BOT" --jq .id)
          git -c user.name="$BOT" -c user.email="$id+$BOT@users.noreply.github.com" commit --allow-empty -m "$TITLE"
          if git push origin HEAD:ecu/sync; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if ! remote=$(git ls-remote --exit-code origin refs/heads/ecu/sync); then
              echo "::error::Could not read ecu/sync after the push failed"
              exit 1
            fi
            tip=$(printf '%s' "$remote" | cut -f1)
            if [ "$tip" = "$(git rev-parse HEAD)" ]; then
              # The push landed, though git didn't see it succeed
              echo "published=true" >> "$GITHUB_OUTPUT"
            elif [ "$tip" != "$BASE" ]; then
              echo "::warning::ecu/sync moved on since this run checked it out; the newer push's run publishes it"
            else
              exit 1
            fi
          fi

      - name: Pull request
        id: pr
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          number=$(gh pr list --head ecu/sync --state open --json number --jq '.[].number')
          if [ -z "$number" ]; then
            gh pr create --head ecu/sync --base main --title "$TITLE" \
              --body "Changes from [ecu](https://github.com/change-engine/ecu/tree/main/github), with lockfiles and generated types refreshed by the ecu sync workflow. Merges once the checks main requires pass."
            number=$(gh pr list --head ecu/sync --state open --json number --jq '.[].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The main-* rulesets need an approving review; as in dependabot.yml, github-actions gives it.
      - name: Approve
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)" != APPROVED ]; then
            gh pr review "$PR" --approve
          fi

      - name: Merge
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        # --auto is refused when nothing is left to wait for: required checks already passed,
        # or no ruleset requires any yet (a new repo). Then merge now; the app can't bypass
        # the rulesets, so this still fails if anything main requires is missing.
        run: |
          gh pr merge "$PR" --auto --squash --subject "$TITLE" ||
            gh pr merge "$PR" --squash --subject "$TITLE"
